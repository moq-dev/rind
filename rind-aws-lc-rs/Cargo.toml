[package]
name = "rind-aws-lc-rs"
version = "1.0.3"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "aws-lc-rs 1.x's API backed by rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"
# aws-lc-rs's own tests and test vectors, under their own licenses.
exclude = ["tests/aws-lc-rs"]

# The aws-lc-rs version whose API this crate offers, which its own version
# tracks (sh/adapter-versions.sh), since it implements aws-lc-rs rather than
# depending on it.
[package.metadata.rind]
upstream = "1"

# aws-lc-rs's feature names, so a manifest naming them builds unchanged.
# `ring-io` and `ring-sig-verify` gate what they gate there; the rest change
# nothing. `fips` is left out, so a manifest asking for it fails to
# resolve: rind is not FIPS validated.
# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "aws-lc-rs"
module = ""
# aws-lc-rs fails to build without one of its C libraries.
features = ["aws-lc-sys"]
skip = { fips = "builds AWS-LC's FIPS module, which rind does not offer", asan = "builds AWS-LC under AddressSanitizer", bindgen = "generates AWS-LC's bindings with libclang" }
# Items rind cannot back, which the README names.
omitted = [
  "aead::AES_*_GCM_SIV",
  "aead::chacha20_poly1305_openssh",
  "agreement::*::generate_for_test",
  "awslc_version",
  "cipher::AES_CFB_IV_LEN",
  "cipher::AES_OFB_IV_LEN",
  "cipher::*::cfb*",
  "cipher::*::ofb",
  "cipher::*::ecb",
  "cipher::*::ecb_pkcs7",
  "cipher::OperatingMode::CFB*",
  "cipher::OperatingMode::ECB",
  "cipher::OperatingMode::OFB",
  "cipher::PaddedBlockDecryptingKey::cbc_iso10126",
  "cipher::DES_*",
  "cipher::AlgorithmId::Des*",
  "cipher::*Context::Iv64",
  "cipher::BufferUpdate",
  "cipher::Streaming*",
  "cmac",
  "kdf",
  "tls_prf",
  "digest::Digest::import_less_safe",
  "digest::SHA224*",
  "hmac::HMAC_SHA224",
  "encoding::Pqdsa*",
  "kem::DecapsulationKey::new",
  "kem::DecapsulationKey::key_bytes",
  "kem::DecapsulationKeyBytes",
  "rand::unsealed",
  "rsa::KeyPair::from_components",
  "signature::RsaKeyPair::from_components",
  "rsa::KeyPairComponents",
  "rsa::KeyPair::sign_digest",
  "signature::RsaKeyPair::sign_digest",
  "rsa::Pkcs1*",
  "signature::ECDSA_P256K1_*",
  "signature::ECDSA_*_SHA1_*",
  "signature::ECDSA_*_SHA3_*",
  "signature::ECDSA_P521_SHA224_*",
  "signature::ML_DSA_*",
  "signature::Pqdsa*",
  "io::der",
  "test",
  "test_file",
  "try_fips_self_test",
  "unstable",
]

[features]
default = ["aws-lc-sys", "alloc", "ring-io", "ring-sig-verify"]
alloc = []
asan = []
aws-lc-sys = []
bindgen = []
dev-tests-only = []
legacy-des = []
non-fips = ["aws-lc-sys"]
prebuilt-nasm = []
ring-io = []
ring-sig-verify = []
test_logging = []
unstable = []

# rind-aws-lc-rs's own: wipes rind's keys and the adapter's heap copies of
# secrets on drop, as aws-lc-rs always does.
wipe = ["rind/wipe"]

[dependencies]
rind = { version = "0.3.2", path = "../rind" }
untrusted = "0.7.1"
zeroize = "1.9"

[dev-dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips", "ring-io", "ring-sig-verify"] }
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
hex = { version = "0.4", features = ["serde"] }
proptest = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# aws-lc-rs's own tests (tests/aws-lc-rs) skip their slow cases under it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(disable_slow_tests)"] }
