[package]
name = "rind-ring"
version = "0.17.4"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "ring 0.17's API backed by rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"
# ring's own tests and test vectors, under their own licenses.
exclude = ["tests/ring"]

# The ring version whose API this crate offers, which its own version tracks
# (sh/adapter-versions.sh), since it implements ring rather than depending on it.
[package.metadata.rind]
upstream = "0.17"

# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "ring"
module = ""
# Items rind cannot back, which the README names.
omitted = [
  "aead::chacha20_poly1305_openssh",
  "io",
  "test",
  "deprecated_test",
  "test_file",
  "rsa::KeyPair::from_components",
  "rsa::KeyPairComponents",
  "signature::RsaEncoding::encode",
]

# ring's feature names, so a manifest naming them builds unchanged. rind-ring
# always has `alloc` and `std`, rind's random source already falls back to
# `/dev/urandom`, and the rest pick platforms, code paths, or tests rind lacks.
[features]
default = ["alloc", "dev_urandom_fallback"]
alloc = []
dev_urandom_fallback = []
less-safe-getrandom-custom-or-rdrand = []
less-safe-getrandom-espidf = []
slow_tests = []
std = ["alloc"]
test_logging = []
unstable-testing-arm-no-hw = []
unstable-testing-arm-no-neon = []
wasm32_unknown_unknown_js = []

[dependencies]
rind = { version = "0.3.2", path = "../rind" }
untrusted = "0.9"

[dev-dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
hex = { version = "0.4", features = ["serde"] }
proptest = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
untrusted = "0.9"
