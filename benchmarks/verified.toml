# The code each library runs that a published formal proof covers, which
# BENCHMARKS.md marks with a ✓. `admin/bench-report render` reads it and
# refuses an entry that names no library, operation, or CPU feature it knows.
#
# An entry earns its ✓ when a machine-checked proof shows that all the code
# computing the operation gives the specified result for every input, in the
# version that library ships, on that architecture and CPU: the cipher and its
# mode, the hash over every block with its padding, the whole scalar
# multiplication or modular exponentiation, and the glue around them, such as
# clamping, byte conversion, and point encoding. Parsing DER key and signature
# containers (SPKI, PKCS#8, PKCS#1), randomness, and the message hash a
# signature takes (its own row) are left out; a hash inside the scheme, as in
# Ed25519, is not. A proof of memory safety, panic freedom, or secret
# independence alone earns none, nor one covering only some of the code, such
# as field operations under unverified point formulas, or a verified routine
# under unverified glue. s2n-bignum's proofs check its own object code and
# HACL*'s its C, so code copied from s2n-bignum or compiled from HACL* counts,
# as ALGORITHMS.md's Sources table says.
#
# Each entry:
#   library     rind, aws-lc-rs, ring, rustcrypto, graviola, libcrux, or openssl
#   operations  report rows, as admin/bench-report's OPERATIONS without the
#               library; `*` matches any message size
#   arch        optional: x86_64 or aarch64, unless the code is the same on both
#   cpu         optional: features the host has, or lacks with a leading `!`,
#               as rind-cpuid names them; needs an arch
#   os          optional: linux or macos, where the code differs by OS
#   proof       whose proof, of which routines, and any restriction
#   link        the proof itself
#
# ring, RustCrypto + dalek, and OpenSSL have none: at most their field
# arithmetic is verified, under unverified point formulas or ladders.
#
# graviola has none. Its X25519 and Ed25519 run only s2n-bignum's verified
# routines, but convert between bytes and limbs in unverified Rust.
#
# rind: X25519, P-256 ECDH and ECDSA on aarch64, SHA-256, HMAC-SHA256, and
# HKDF-SHA256 on aarch64 with the crypto extension, SHA3-256 and SHA3-512,
# whose Rust sponge `proofs/` proves against SymCrypt's Lean FIPS 202 spec
# and s2n-bignum's Keccak-f theorems, and SHA-512 and Ed25519 on aarch64 and
# where x86_64's SHA-512 block routine has a proof, whose
# Rust `proofs/` proves against s2n-bignum's and aws-lc-verification's
# theorems, ChaCha20 header protection, whose Rust `proofs/` proves against
# RFC 8439, HACL*'s rounds included, AES header protection on x86_64 with
# AES-NI and aarch64 with the crypto extension, whose Rust `proofs/` proves
# against Vale's FIPS 197 spec, and AES-GCM on x86_64 with AES-NI but no VAES,
# whose Rust, key setup and by-8 kernels included, `proofs/` proves against
# Vale's specs, and with AVX and MOVBE against Vale's theorems for its
# routines. On x86_64 CPUs with AVX2, or AMD's, rind runs OpenSSL's or aws-lc's
# unproven routines, which are faster there, so neither SHA-512 nor Ed25519
# earns the ✓ there. Every other rind operation runs unverified code,
# such as SHA-256's block function on x86_64 or without the crypto extension,
# under padding and HMAC glue that `proofs/` proves, ChaCha20-Poly1305's
# aws-lc one-pass routines on x86_64, under glue `proofs/` proves, or x86_64
# P-256's generator multiplication, whose mixed addition is aws-lc's.
#
# rind's RSA-2048 PKCS#1 v1.5 verification earns the ✓ on x86_64 with BMI2
# and ADX, whose Montgomery products are s2n-bignum's Karatsuba routines; its
# message hash is its own row. PSS's MGF1 and H' hash inside the scheme, so
# RSA-2048 PSS verification waits on a proof of x86_64's SHA-256 block
# function.
[[verified]]
library = "rind"
operations = ["x25519-ecdh"]
arch = "x86_64"
proof = "rind's Lean proof, through Aeneas and a hand model of the function-pointer dispatch Aeneas cannot translate, which assumes each key's dispatch table holds its own curve's functions, the only table rind builds, of its agreement API's X25519 down to s2n-bignum's routines, composed with s2n-bignum's HOL Light proofs of curve25519_x25519, curve25519_x25519base, their _alt forms without BMI2 and ADX, and bignum_eq, of s2n-bignum's own object code, which rind transliterates"
link = "https://github.com/kixel-ai/rind/blob/main/proofs/Rind/X86_64/X25519.lean"

