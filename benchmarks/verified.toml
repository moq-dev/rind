# aws-lc-rs: SHA-512 on Intel x86_64 alone. On aarch64, NSym's proof of
# sha512_block_data_order_hw asserts the digest in registers at its loop's
# exit, and the store to the state is outside it
# (https://github.com/awslabs/aws-lc-verification/blob/797302470c1703cbb1a3a6fa98daffef0bfd3d80/NSym/proof/proofs/SHA512/sha512_block_armv8_unbounded.ml#L138),
# so the SAW proof of the C around it rests on an unproven result. Its X25519
# and Ed25519 call the same s2n-bignum routines from unverified C, which
# clamps the scalar, refuses X25519's all-zero secret, and composes Ed25519's
# SHA-512.
[[verified]]
library = "aws-lc-rs"
operations = ["sha512/*"]
arch = "x86_64"
cpu = ["intel", "avx", "ssse3"]
proof = "aws-lc-verification's SAW proof of SHA-512 through EVP_Digest, padding included, over sha512_block_data_order_avx, which aws-lc runs only on Intel; of aws-lc c21d40da, whose SHA-512 code 5.12.0 keeps"
link = "https://github.com/awslabs/aws-lc-verification/blob/797302470c1703cbb1a3a6fa98daffef0bfd3d80/SAW/proof/SHA512/verify-SHA512-x86.saw"

