# The decision on every gap: each operation where another library beats rind
# by more than 10%, on a host in benchmarks/data or a CPU tier of the nightly
# bench. BENCHMARKS.md lists them under Known gaps. `admin/bench-report
# render` refuses a gap without an entry, and an entry that names no gap, so
# a refresh that opens or closes one must update this file.
#
# Each entry:
#   operations  report rows on a host, as admin/bench-report's OPERATIONS
#               without the library; nightly benchmark IDs on a tier, as the
#               report's tier table shows them
#   on          hosts, or CPU tiers as the report's tier columns name them;
#               every operation must be a gap on every one
#   quest       the speed quest that closes it, or
#   reason      why it stays

[[gap]]
operations = ["sha256/64B"]
on = ["nixos"]
reason = "Narrowed by [#352](https://github.com/moq-dev/rind/pull/352): on the SHA extensions the last block is padded and the digest written in registers, and `digest::Context::finish` takes `&mut self`, so it no longer copies the context. Closed by [#394](https://github.com/moq-dev/rind/pull/394), after this data, which drops the context's wipe on drop: on GitHub's AMD EPYC 9V45 runner it measured rind at 0.84× main's time at 64 B and 0.86× RustCrypto's. The next refresh drops this entry."

[[gap]]
operations = ["rsa2048-pkcs1-sha256-sign"]
on = ["nixos"]
reason = "Noise: other work kept 5 CPUs busy during this run, in which PSS signing, the same exponentiation, measured 0.95× graviola's time. Interleaved runs on `nixos` the same morning measured rind's PKCS#1 signing at 436 to 446 µs against graviola's 432 to 542 µs and ring's 459 to 568 µs. The next refresh rechecks it."

[[gap]]
operations = ["ed25519-verify"]
on = ["ovh-iad", "ovh-sea"]
reason = "These VPSes' virtual CPUs hide ADX, and there rind ran s2n-bignum's verified `_alt` routines, which RustCrypto's AVX2 backend beats. Closed by [#415](https://github.com/moq-dev/rind/pull/415), after this data, which runs a port of that backend there: its collection measured rind at 1.08× RustCrypto's time on both VPSes. The next refresh drops this entry."

[[gap]]
operations = ["ed25519-sign"]
on = ["ovh-iad"]
reason = "Noise from the VPS's other tenants: `ovh-sea`, the same virtual CPU, measured 0.92× aws-lc-rs's time, and no dedicated host shows it. The next refresh rechecks it."

[[gap]]
operations = ["p256-ecdsa-verify/*"]
on = ["no ADX"]
reason = "CPUs older than Broadwell and Zen lack ADX, and so do virtual CPUs that hide it, as `ovh-iad`'s and `ovh-sea`'s do. There rind runs s2n-bignum's verified `_alt` routines, which trail by more than 10% only on the nightly runners: on the VPSes P-256 verification measured 1.05× aws-lc-rs's time."

[[gap]]
operations = ["chacha20poly1305/*/16KB", "xchacha20poly1305/*/16KB"]
on = ["no AES-NI"]
reason = "Without SSE4.1 rind runs Graviola's scalar Poly1305 rather than port BoringSSL's SSE2 `poly1305_vec.c` for CPUs older than Westmere, as ALGORITHMS.md records."

[[gap]]
operations = [
  "aes128-gcm/32B",
  "aes128-gcm/1350B",
  "aes128-gcm-open/32B",
  "aes256-gcm/32B",
  "aes256-gcm/1350B",
  "aes256-gcm-open/32B",
  "chacha20poly1305/32B",
  "quic-header-protection/aes128",
  "quic-header-protection/aes256",
  "quic-header-protection/chacha20",
  "sha256/64B",
  "sha256/1350B",
  "sha512/64B",
  "sha512/1350B",
  "hmac-sha256/64B",
  "hmac-sha256/1350B",
  "hkdf-sha256/extract-expand",
  "hkdf-sha256/expand",
]
on = ["kixtop"]
reason = "DIT: the M4 has it, and rind turns it on and off around every call that handles a secret, which costs about 30 to 55 ns a call there; the other libraries never set it. Keeping it per call was decided with the maintainer from [#387](https://github.com/moq-dev/rind/pull/387)'s findings. Holding `rind::cpu::Dit::hold()` ([#431](https://github.com/moq-dev/rind/pull/431)) across a batch of calls, as MoQ does, pays it once and closes every one of these gaps: the rind (DIT held) column times that, and on [`9e7f6a5a`](https://github.com/moq-dev/rind/commit/9e7f6a5a9ea59a0cf1251c24af6c5d4f21c2b0fd), the run this report shows, they measured each within 10% of the fastest library, HMAC-SHA-256 at 64 B at the edge (1.10× RustCrypto's)."
