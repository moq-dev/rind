# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Run `just audit` to validate; `just check` runs it when a manifest changes.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (proc-macro, build-time only). Pulled
    # by hax-lib-macros under libcrux's `cfg(hax)` dependencies, which only
    # hax's verification toolchain compiles; no build of rind does.
    "RUSTSEC-2026-0173",

    # crypto-bigint 0.5 timing: openmls_rust_crypto, which rind-openmls's
    # tests compare against, reaches it through p256 and p384 0.13. No
    # published crate depends on it.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
# rind-bench, rind-cpuid, rind-timing, and rind-fuzz are publish = false tools.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots cert bundle
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    # libfuzzer-sys vendors LLVM's libFuzzer harness, which is NCSA licensed.
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path/workspace deps don't carry versions; that's fine for intra-workspace use.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
