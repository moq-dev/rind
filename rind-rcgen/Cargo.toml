[package]
name = "rind-rcgen"
version = "0.14.4"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "rcgen KeyPair backed by rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"

# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "rcgen"
module = ""
items = ["KeyPair"]
# rcgen's default backend, whose behavior the README documents.
features = ["ring"]
skip = { fips = "builds AWS-LC's FIPS module, which rind does not offer" }
# Items rind cannot back, which the README names.
omitted = [
  "KeyPair::generate_rsa_for",
]

[features]
# rcgen's default features include `pem`.
default = ["pem"]
# rcgen's PEM methods on `KeyPair`.
pem = ["dep:base64ct", "rcgen/pem"]
# rind-rcgen's own: wipes rind's keys and the key pair's PKCS#8 copy on drop.
wipe = ["rind/wipe"]
# rcgen's `impl Zeroize for KeyPair`, which clears its PKCS#8 copy.
zeroize = []

[dependencies]
base64ct = { version = "1.8", optional = true, features = ["alloc"] }
rcgen = { version = "0.14", default-features = false }
rind = { version = "0.3.2", path = "../rind" }
rustls-pki-types = "1.12"
zeroize = "1.9"

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
# Its `crypto` feature, which the tests then share, gives rcgen's own key
# identifiers to compare against.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rind-rustls = { path = "../rind-rustls" }
rustls = { version = "0.23.23", default-features = false, features = ["aws-lc-rs", "std"] }
