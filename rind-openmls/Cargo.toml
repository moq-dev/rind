[package]
name = "rind-openmls"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "OpenMLS crypto provider backed by rind"
categories = ["cryptography"]
# openmls_traits needs 1.91, above the workspace's.
rust-version = "1.91"
readme = "README.md"

# The openmls_traits version whose provider traits this crate implements,
# which openmls_rust_crypto, the provider it replaces, also tracks
# (sh/adapter-versions.sh).
[package.metadata.rind]
upstream = "0.6"

# openmls_rust_crypto's features that rind backs. The draft features it also
# has, `draft-ietf-mls-pq-ciphersuites`, `targeted-messages-draft`, and
# `virtual-clients-draft`, need primitives rind lacks, so a manifest naming one
# fails to resolve instead.
# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "openmls_rust_crypto"
module = ""
skip = { draft-ietf-mls-pq-ciphersuites = "needs a post-quantum HPKE KEM rind lacks", targeted-messages-draft = "needs HPKE's PSK mode, which rind lacks", virtual-clients-draft = "needs FF1, which rind lacks" }

[features]
extensions-draft = [
  "openmls_traits/extensions-draft",
  "openmls_memory_storage/extensions-draft",
]
test-utils = ["openmls_memory_storage/test-utils"]

[dependencies]
openmls_memory_storage = "0.6"
openmls_traits = "0.6"
rind = { version = "0.3.2", path = "../rind" }
tls_codec = { version = "0.5", default-features = false }

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
openmls = { version = "0.9", features = ["test-utils"] }
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
