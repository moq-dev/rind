"riscv64gc-unknown-linux-gnu" = "divu x2"
"s390x-unknown-linux-gnu" = "dlgr x2"

[[public]]
function = "<u64>::_fmt_inner"
why = "Formats a number for Debug or Display output, which never holds a secret. Only 32-bit PowerPC reaches it, through the `.got2` table of addresses its position-independent code loads from, which the scan follows whole."
[public.holds]
"powerpc-unknown-linux-gnu" = "calls __udivdi3"
