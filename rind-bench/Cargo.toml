[[bench]]
name = "rsa_pub"
harness = false

[[bench]]
name = "rsa_priv"
harness = false

[[bench]]
name = "rsa_gen"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "xchacha20poly1305"
harness = false

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "mlkem768"
harness = false

[[bench]]
name = "ed25519"
harness = false

[[bench]]
name = "hkdf"
harness = false

[[bench]]
name = "cipher"
harness = false

[[bench]]
name = "key_wrap"
harness = false

[[bench]]
name = "pbkdf2"
