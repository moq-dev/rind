[package]
name = "rind-bench"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
rind = { path = "../rind" }
codspeed-criterion-compat = { optional = true, version = "6" }

[dev-dependencies]
aes-gcm = "0.11"
aws-lc-rs = { version = "1.16", features = ["non-fips"], default-features = false }
# For XChaCha20-Poly1305, which aws-lc-rs does not expose.
aws-lc-sys = "0.47"
chacha20poly1305 = "0.11"
criterion = "0.8"
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8", "rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", features = ["serde"] }
hmac = "0.13"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768", "alloc"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
p256 = { version = "0.14", features = ["ecdh", "getrandom"] }
p384 = { version = "0.14", features = ["ecdh", "getrandom"] }
proptest = "1.5.0"
ring = "0.17"
rind-jsonwebtoken = { path = "../rind-jsonwebtoken" }
rind-rustls = { path = "../rind-rustls" }
rsa = { version = "=0.10.0-rc.19", features = ["sha2"] }
rustls = { version = "0.23.36", default-features = false, features = ["aws-lc-rs", "ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["getrandom"] }

[target.'cfg(target_family = "unix")'.dev-dependencies]
foreign-types = "0.3"
openssl = "0.10"
openssl-sys = "0.9"

[features]
__bench_openssl = []
__bench_codspeed = ["dep:codspeed-criterion-compat"]

[[bench]]
name = "x25519"
harness = false

[[bench]]
name = "p256"
harness = false

[[bench]]
name = "p384"
harness = false

[[bench]]
name = "p521"
harness = false

[[bench]]
name = "sha1"
harness = false

[[bench]]
name = "sha2"
harness = false

[[bench]]
name = "aes_gcm"
harness = false

[[bench]]
name = "rsa_pub"
harness = false

[[bench]]
name = "rsa_priv"
harness = false

[[bench]]
name = "rsa_gen"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "xchacha20poly1305"
harness = false

[[bench]]
name = "hmac"
harness = false

[[bench]]
name = "mlkem768"
harness = false

[[bench]]
name = "ed25519"
harness = false

[[bench]]
name = "hkdf"
harness = false

[[bench]]
name = "cipher"
harness = false

[[bench]]
name = "pbkdf2"
harness = false

[[bench]]
name = "jsonwebtoken"
harness = false

[[bench]]
name = "rustls"
harness = false
