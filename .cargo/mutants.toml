# cargo-mutants' settings. Run it through `admin/mutants`, which also skips
# generated assembly and the code this host's architecture never compiles.

# Runs each mutant's tests in parallel, in about half `cargo test`'s time.
test_tool = "nextest"

# Turns on the zeroing and heap scratch tests, without which a wiping `Drop`
# does nothing a test can see.
features = ["rind/wipe"]

exclude_globs = [
  # Constants imported with aws-lc's, BoringSSL's, and OpenSSL's assembly,
  # which proofs and differential tests own.
  "rind/src/low/*/aws_lc/**",
  "rind/src/low/*/boringssl/**",
  "rind/src/low/*/openssl/**",
  # Test-only code under a `cfg(test)` cargo-mutants does not recognise.
  # See UPSTREAM.md, "cargo-mutants misses compound `cfg(test)`s".
  "rind/src/low/tests.rs",
  "rind/src/low/guard_pages.rs",
  # Scanner fixtures, compiled only by admin/ct-vartime, never by the tests.
  "rind/src/low/vartime_planted.rs",
  # Tools, not libraries.
  "rind-bench/**",
  "rind-cpuid/**",
  "fuzz/**",
  # The FIPS module, which refuses the CPUs admin/mutants masks features on;
  # its differential and break tests cover what it adds to rind.
  "rind-fips/**",
]

# Each surviving mutant no test can catch, with why.
