# cargo-mutants' settings. Run it through `admin/mutants`, which also skips
# generated assembly and the code this host's architecture never compiles.

# Runs each mutant's tests in parallel, in about half `cargo test`'s time.
test_tool = "nextest"

exclude_globs = [
  # Constants imported with aws-lc's, BoringSSL's, and OpenSSL's assembly,
  # which proofs and differential tests own.
  "rind/src/low/*/aws_lc/**",
  "rind/src/low/*/boringssl/**",
  "rind/src/low/*/openssl/**",
  # Test-only code under a `cfg(test)` cargo-mutants does not recognise.
  "rind/src/low/tests.rs",
  # AVX-512 only, which no test host has: quest/m3/confidence/mutants-avx512.md.
  "rind/src/low/x86_64/mlkem768_sample_poly_ntt_8x.rs",
  "rind/src/low/x86_64/rsaz_avx512.rs",
  # Tools, not libraries.
  "rind-bench/**",
  "rind-cpuid/**",
  "fuzz/**",
]

