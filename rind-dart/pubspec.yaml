name: rind
description: >-
  Fast, misuse-resistant cryptography for Dart and Flutter, through FFI to
  rind, a pure-Rust library: AEADs, hashes, HMAC, HKDF, PBKDF2, X25519,
  Ed25519, ECDSA, ECDH, RSA, and ML-KEM.
version: 0.1.0
repository: https://github.com/moq-dev/rind/tree/main/rind-dart
issue_tracker: https://github.com/moq-dev/rind/issues
topics:
  - cryptography
  - crypto
  - ffi
  - encryption

# No web: rind has no wasm build, so the package refuses that target.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.2.0
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  cryptography: ^2.9.0
  lints: ^6.0.0
  pointycastle: ^4.0.0
  test: ^1.33.0
