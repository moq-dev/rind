[package]
name = "rind-dart"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "The C ABI behind the rind package for Dart and Flutter"
rust-version.workspace = true
# Only the Dart package beside this manifest is published; its build hook
# compiles this crate.
publish = false
# Neither the Flutter app that runs the Dart tests on mobile nor the
# rind_cryptography package beside it is part of the package.
exclude = ["integration", "cryptography"]

[lib]
name = "rind_dart"
crate-type = ["cdylib"]

[dependencies]
rind = { version = "0.4.0", path = "../rind" }

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
