[workspace]
resolver = "2"
members = [
  "rind",
  "rind-bench",
  "rind-cpuid",
  "rind-dimpl",
  "rind-instant-acme",
  "rind-object-store",
  "rind-rcgen",
  "rind-ring",
  "rind-rustls",
  "rind-jsonwebtoken",
  "fuzz"
]

[workspace.package]
rust-version = "1.90"

[profile.dev.build-override]
# Left unset, cargo gives a build dependency debuginfo only when the same
# build also compiles it for runtime, which `cargo test` does and clippy does
# not. libc's hash then differs, and aws-lc-sys's C build runs once for each.
debug = false

[profile.bench]
lto = "thin"
debug = true

# Debug builds of these dependencies branch on secrets, which ctgrind refuses:
# fiat-crypto's plain arithmetic is proven never to overflow but still checks
# the flags, as libcrux-ml-kem's portable arithmetic does, curve25519-dalek
# checks its arithmetic and asserts on scalar digits, and subtle asserts that
# each `Choice` is 0 or 1.
[profile.dev.package.fiat-crypto]
overflow-checks = false

[profile.dev.package.libcrux-ml-kem]
overflow-checks = false

[profile.dev.package.curve25519-dalek]
debug-assertions = false
overflow-checks = false

[profile.dev.package.subtle]
debug-assertions = false
