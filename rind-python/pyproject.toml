[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pyrind"
description = "Fast cryptography for Python from rind, a pure-Rust library: AEADs, hashes, HMAC, HKDF, PBKDF2, X25519, Ed25519, ECDSA, ECDH, RSA, and ML-KEM"
readme = "README.md"
requires-python = ">=3.11"
# rind's own licenses, and those of the code it copies (rind/LICENSE).
license = "(Apache-2.0 OR ISC OR MIT-0) AND (Apache-2.0 OR ISC OR MIT) AND Apache-2.0 AND ISC AND BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["cryptography", "aead", "ed25519", "ecdsa", "ml-kem"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
# maturin takes the version from rind-python's Cargo.toml, which release-plz
# bumps.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/moq-dev/rind"
Documentation = "https://github.com/moq-dev/rind/tree/main/rind-python"

[tool.maturin]
python-source = "python"
module-name = "pyrind._rind"
