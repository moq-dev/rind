name: fuzz

# Fuzzes each target nightly on x86_64, keeping its corpus between runs in the
# Actions cache, then replays the corpus on each slower CPU tier and on
# aarch64's (see sh/fuzz-replay.sh). A crash, timeout, or out-of-memory fails
# the run, which alert.yml reports, and the input that caused it is uploaded
# as an artifact.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build fuzz targets (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: Install cargo fuzz
        run: cargo install cargo-fuzz

      # The cfg lets sh/fuzz-replay.sh deny CPU features.
      - name: Build fuzz targets
        run: |
          cargo fuzz build
          mkdir bin
          host=$(rustc -vV | sed -n 's/^host: //p')
          for target in $(cargo fuzz list); do
            cp "target/$host/release/$target" bin/
          done
        env:
          RUSTFLAGS: --cfg rind_cpu_disable

      - name: List fuzz targets
        id: list
        run: echo "targets=$(cargo fuzz list | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-targets-${{ runner.arch }}
          path: bin/
          retention-days: 1

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      CORPUS: fuzz/corpus/${{ matrix.target }}
      ARTIFACTS: fuzz/artifacts/${{ matrix.target }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wycheproof's signatures seed `verify`.
      - uses: ./.github/actions/vectors

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets-X64
          path: bin/

      # A cache entry can't be overwritten, so each run saves a new one and
      # restores the latest.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed the corpus
        run: sh/fuzz-seed.sh

      # Twenty minutes per target, with every input bounded to 30 seconds.
      - name: Fuzz
        run: |
          chmod +x "bin/$TARGET"
          mkdir -p "$CORPUS" "$ARTIFACTS"
          "bin/$TARGET" "$CORPUS" -max_total_time=1200 -timeout=30 -rss_limit_mb=2048 \
            -artifact_prefix="$ARTIFACTS/" -print_final_stats=1

      # Drops inputs that add no coverage, so the corpus stays small.
      - name: Minimize the corpus
        run: |
          mkdir minimized
          "bin/$TARGET" -merge=1 minimized "$CORPUS"
          rm -r "$CORPUS"
          mv minimized "$CORPUS"

      - name: Replay the corpus on slower CPU tiers
        run: sh/fuzz-replay.sh "bin/$TARGET" "$CORPUS" -timeout=30 -rss_limit_mb=2048 -artifact_prefix="$ARTIFACTS/"

      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ${{ env.ARTIFACTS }}/

  # The x86_64 corpus, saved above, on each aarch64 tier.
  replay-aarch64:
    name: Replay ${{ matrix.target }} on aarch64
    needs: [build, fuzz]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      CORPUS: fuzz/corpus/${{ matrix.target }}
      ARTIFACTS: fuzz/artifacts/${{ matrix.target }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets-ARM64
          path: bin/

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Replay the corpus
        run: |
          chmod +x "bin/$TARGET"
          mkdir -p "$ARTIFACTS"
          sh/fuzz-replay.sh "bin/$TARGET" "$CORPUS" -timeout=30 -rss_limit_mb=2048 -artifact_prefix="$ARTIFACTS/"

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}-aarch64
          path: ${{ env.ARTIFACTS }}/
