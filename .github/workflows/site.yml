name: Site

# Builds site/, the landing page, and checks its links on every pull request,
# since the page quotes the README and links files across the repository. The
# merge queue's `just ci` runs the same sh/site.sh when its scope matches.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Bun site/package.json pins, which the flake asserts its own matches.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json

      - name: Build and check
        run: sh/site.sh
