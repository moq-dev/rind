name: ctgrind

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ctgrind-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        build: ["", --release]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: ctgrind tests
        run: admin/ctgrind ${{ matrix.build }}

  # Valgrind hides ADX, which `admin/ctgrind`'s build switch overrides to
  # check s2n-bignum's ADX routines, so this job denies it to check what
  # CPUs without ADX run: their `_alt` twins, and aws-lc's Montgomery
  # multiplication for RSA. The `no-adx` row keeps AVX2, as Haswell does, for
  # aws-lc's RSAZ exponentiation of RSA-2048. The `no-avx` row denies AVX, the
  # SHA extensions, and the vendor too, for what CPUs such as Westmere run:
  # aws-lc's SSE4.1 ChaCha20-Poly1305 and SSSE3 ChaCha20, SHA-1, and SHA-256,
  # the portable ML-KEM arithmetic, the SSE2 selects, rind's AES-GCM and GHASH
  # intrinsics without VEX encoding, and aws-lc's AES-NI CTR. The `no-aes` row
  # also denies AES-NI, PCLMULQDQ, and SSE4.1, for aws-lc's vpaes and SSSE3
  # GHASH, and ChaCha20 and Poly1305 in separate passes, as the first Core 2s
  # run, and the `no-ssse3` row SSSE3, for aws-lc's SSE2 AES, integer GHASH,
  # ChaCha20, SHA-1, and SHA-256, as `qemu64` runs. The denial takes `--cfg
  # rind_cpu_disable`, so the release build stays the code that ships.
  x86_64-portable:
    name: x86_64-portable (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: no-adx
            deny: RIND_TEST_X86_AVX2=1
          - cpu: no-avx
            deny: RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_intel=1 RIND_CPU_DISABLE_sha=1 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=1 RIND_TEST_X86_SSE41=1
          - cpu: no-aes
            deny: RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_intel=1 RIND_CPU_DISABLE_sha=1 RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pclmulqdq=1 RIND_CPU_DISABLE_sse4.1=1 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=0 RIND_TEST_X86_SSE41=0
          - cpu: no-ssse3
            deny: RIND_CPU_DISABLE_ssse3=1 RIND_TEST_X86_SSSE3=0 RIND_TEST_X86_SSE41=0 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # A denial set to any value takes effect, so a row's extra variables
      # are words for `env`.
      - name: ctgrind tests
        run: |
          read -ra deny <<< "$DENY"
          env "${deny[@]}" admin/ctgrind --release
        env:
          RUSTFLAGS: --cfg rind_cpu_disable
          DENY: ${{ matrix.deny }}
          RIND_CPU_DISABLE_adx: 1
          RIND_TEST_X86_BMI2_ADX: 0

  # The arm64 runner's core has the crypto extension, so this job denies it
  # to check vpaes, NEON GHASH, and the scalar SHA-1 and SHA-256 that cores
  # without it run. The denial takes `--cfg rind_cpu_disable`, as above.
  aarch64-portable:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: ctgrind tests
        run: admin/ctgrind --release
        env:
          RUSTFLAGS: --cfg rind_cpu_disable
          RIND_CPU_DISABLE_aes: 1
          RIND_CPU_DISABLE_pmull: 1
          RIND_CPU_DISABLE_sha2: 1
          RIND_TEST_ARM_CRYPTO_EXT: 0

  # The arm64 runner executes 32-bit ARM natively, so an armhf valgrind checks
  # the armv7 build without emulation. Its core has NEON and the crypto
  # extension, but valgrind hides `AT_HWCAP2` from the program, so the NEON
  # code is checked here and the extension's is not (see `admin/ctgrind`).
  #
  # Release only: constant time matters in the code that ships, and a debug
  # build can only add findings in code that does not. Valgrind runs every
  # thread on one core, so the suites run as parallel jobs instead.
  armv7:
    name: armv7 (${{ matrix.suite }})
    strategy:
      # One suite's failure says nothing about the others.
      fail-fast: false
      matrix:
        suite: [unit, wycheproof, adapters]

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Install armhf toolchain and valgrind
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf

      - name: ctgrind tests
        run: admin/ctgrind ${{ matrix.suite }} --target armv7-unknown-linux-gnueabihf --release
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          RIND_TEST_ARM_NEON: 1
          RIND_TEST_ARM_CRYPTO_EXT: 0
