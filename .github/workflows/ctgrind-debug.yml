name: ctgrind debug

# Runs ctgrind's armv7 jobs on debug builds, which the nightly `ctgrind`
# checks only in release: debug code is not what ships, so a weekly run is
# enough to catch a leak there before it reaches a release build's inlining.
# `--no-fail-fast` reports every failing test binary in one run.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ctgrind-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors `ctgrind.yml`'s armv7 job, which explains the toolchain and the
  # `no-neon` row, without `--release`.
  armv7:
    name: armv7 debug (${{ matrix.suite }}${{ matrix.neon == '0' && ', no-neon' || '' }})
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, wycheproof, adapters]
        neon: ["1"]
        include:
          - suite: unit
            neon: "0"

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Install armhf toolchain and valgrind
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf

      - name: ctgrind tests
        run: |
          # Debug assertions enable the denial, so no `--cfg rind_cpu_disable`.
          if [ "$RIND_TEST_ARM_NEON" = 0 ]; then
            export RIND_CPU_DISABLE_neon=1
          fi
          admin/ctgrind ${{ matrix.suite }} --target armv7-unknown-linux-gnueabihf --no-fail-fast
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          RIND_TEST_ARM_NEON: ${{ matrix.neon }}
          RIND_TEST_ARM_CRYPTO_EXT: 0
