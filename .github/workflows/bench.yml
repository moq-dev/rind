name: bench

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  # CodSpeed refuses an upload with too many benchmarks, so each shard builds
  # and uploads every third bench target; shards of one workflow run merge
  # into one report.
  codspeed:
    name: codspeed (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      # CodSpeed authenticates the upload with the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install cargo-codspeed
        run: cargo binstall -y cargo-codspeed

      - name: Build benchmarks
        run: |
          mapfile -t benches < <(cargo metadata --format-version 1 --no-deps |
            jq -r --argjson shard ${{ matrix.shard }} '[.packages[] | select(.name == "rind-bench").targets[]
              | select(.kind == ["bench"]).name] | sort | to_entries[]
              | select(.key % 3 == $shard - 1) | "--bench", .value')
          # Without --bench, cargo codspeed builds every target into one upload.
          [ ${#benches[@]} -gt 0 ] || { echo "no bench targets for shard ${{ matrix.shard }}"; exit 1; }
          cargo codspeed build -p rind-bench --features __bench_codspeed "${benches[@]}"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run

  # Each row reads rind's time relative to the fastest of aws-lc-rs and ring
  # in the same run, not as a device's: the arm64 runner's Neoverse core is
  # no phone or board, and it times the armv7 build natively too.
  #
  # A portable row denies both libraries what the slower path lacks: on
  # aarch64, the crypto extension and the SHA-512 and SHA-3 instructions, as
  # a Raspberry Pi 4 lacks them, and one row only the SHA-512 and SHA-3
  # instructions, as a Cortex-A76 and a Neoverse N1 lack them, so rind runs
  # its 4-way AES-GCM kernels, scalar SHA-512, and scalar Keccak; on armv7,
  # the crypto extension, which no ARMv7 core has, and which aws-lc's 32-bit
  # ARM detection has no variable to deny, so its build fixes its
  # capabilities to NEON alone with `OPENSSL_STATIC_ARMCAP`; on x86_64, what Sandy Bridge lacks: AVX2,
  # BMI1 and BMI2, ADX, the SHA extensions, AVX-512, VAES, and VPCLMULQDQ.
  # One x86_64 row denies only AVX-512 IFMA, so RSA signing takes the path
  # of CPUs without it, such as Zen 3 and Intel's client cores, whichever CPU
  # the runner draws; an RSA change's A/B reads it. Another denies all of
  # AVX-512 but keeps VAES and VPCLMULQDQ, so the VAES AVX2 path of Zen 3 and
  # Intel's client cores is timed every night, not only when the native row
  # draws a CPU without AVX-512.
  # Two more x86_64 rows time mostly AES: one also denies AVX, as Westmere
  # and the Goldmont Atoms lack it, and one AES-NI, PCLMULQDQ, and SSE4.1
  # too, as the first Core 2s lack them, which also times ChaCha20-Poly1305
  # in separate passes. A last row denies SSSE3 as well, as QEMU's default
  # `qemu64` model and pre-Core 2 CPUs lack it, and times the primitives that
  # then run integer or SSE2 code. rind's denial takes `--cfg
  # rind_cpu_disable`, so these rows time release code, without the debug
  # assertions that would otherwise enable it. ring has no way to deny it a
  # feature, so these rows leave it out. Each times the benchmarks whose
  # code the denied features change. The generic row times rind's portable
  # backend, forced by `--cfg rind_portable`, against aws-lc's C without
  # assembly, which aws-lc-sys's cc builder builds only below opt-level 3 and
  # its CMake builder, its default without assembly, only at 0.
  native:
    name: native (${{ matrix.target }}${{ matrix.portable && ', portable' || '' }}${{ matrix.cpu && format(', {0}', matrix.cpu) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            personality: linux64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            personality: linux64
            portable: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            personality: linux64
            portable: true
            cpu: no-sha3
            benches: --bench aes_gcm --bench sha2 --bench sha3 --bench hmac --bench hkdf --bench mlkem --bench mldsa
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04-arm
            personality: linux32
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04-arm
            personality: linux32
            portable: true
            cpu: no-crypto
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            # An RSA A/B on GitHub's runners reads this row: a runner may draw
            # a CPU with IFMA, so only this row times the same path every run.
            cpu: no-ifma
            benches: --bench rsa_priv
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-avx512
            benches: --bench aes_gcm --bench mlkem --bench rsa_priv
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-adx
            benches: --bench rsa_priv --bench rsa_pub --bench rsa_gen --bench p256 --bench p384 --bench p521 --bench x25519 --bench ed25519
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-avx
            benches: --bench aes_gcm --bench cipher --bench sha1 --bench sha2
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-aes
            benches: --bench aes_gcm --bench cipher --bench key_wrap --bench chacha20poly1305 --bench xchacha20poly1305
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-ssse3
            benches: --bench aes_gcm --bench cipher --bench key_wrap --bench chacha20poly1305 --bench xchacha20poly1305 --bench sha1 --bench sha2
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: generic
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Hosted hardware can change under the same label. The personality
      # makes the kernel list the features the target's code sees, such as
      # the crypto instructions aws-lc-rs uses. Arm kernels call that list
      # `Features`, and x86 ones `flags`.
      - name: Record the CPU
        shell: bash
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n1)
          features=$(setarch ${{ matrix.personality }} grep -m1 -E '^(Features|flags)' /proc/cpuinfo | cut -d: -f2)
          echo "CPU: $model; ${{ matrix.target }} features:$features" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install OpenSSL
        if: matrix.target != 'armv7-unknown-linux-gnueabihf'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install armhf toolchain and OpenSSL
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf libssl-dev:armhf

      # Only rind and the libraries it is measured against.
      - name: Run benchmarks
        run: |
          libs='rind|aws-lc-rs|ring'
          config=()
          if [ "${{ matrix.portable }}" = true ]; then
            libs='rind|aws-lc-rs'
            export RUSTFLAGS='--cfg rind_cpu_disable'
            case "${{ matrix.target }}/${{ matrix.cpu }}" in
              # aws-lc's SHA512 and SHA3 bits.
              aarch64-*/no-sha3)
                export RIND_CPU_DISABLE_sha3=1
                export OPENSSL_armcap='~0x840'
                ;;
              aarch64-*)
                export RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pmull=1 RIND_CPU_DISABLE_sha2=1 RIND_CPU_DISABLE_sha3=1
                # aws-lc's AES, SHA1, SHA256, PMULL, SHA512, and SHA3 bits.
                export OPENSSL_armcap='~0x87c'
                ;;
              armv7-*/no-crypto)
                export RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pmull=1 RIND_CPU_DISABLE_sha1=1 RIND_CPU_DISABLE_sha2=1
                # See UPSTREAM.md, "aws-lc cannot deny 32-bit ARM features at run time".
                export CFLAGS_armv7_unknown_linux_gnueabihf='-DOPENSSL_STATIC_ARMCAP -DOPENSSL_STATIC_ARMCAP_NEON'
                ;;
              # AVX-512 F, DQ, IFMA, CD, BW, and VL in CPUID leaf 7's EBX, and
              # VBMI, VBMI2, VNNI, BITALG, and VPOPCNTDQ in its ECX.
              x86_64-*/no-avx512)
                export RIND_CPU_DISABLE_avx512f=1 RIND_CPU_DISABLE_avx512dq=1 RIND_CPU_DISABLE_avx512ifma=1 RIND_CPU_DISABLE_avx512bw=1 RIND_CPU_DISABLE_avx512vl=1 RIND_CPU_DISABLE_avx512vbmi=1 RIND_CPU_DISABLE_avx512vbmi2=1
                export OPENSSL_ia32cap='~0x0:~0x5842d0230000'
                ;;
              # IFMA in CPUID leaf 7's EBX, which both libraries' dual RSAZ
              # needs.
              x86_64-*/no-ifma)
                export RIND_CPU_DISABLE_avx512ifma=1
                export OPENSSL_ia32cap='~0x0:~0x200000'
                ;;
              # Haswell's path: without ADX and AVX-512 IFMA, and for aws-lc
              # without BMI2, ADX, and AVX-512 F, DQ, IFMA, CD, BW, and VL in
              # CPUID leaf 7's EBX, so both run RSAZ for RSA-2048, and
              # neither the dual AVX-512 RSAZ.
              x86_64-*/generic)
                export RUSTFLAGS='--cfg rind_portable --cfg curve25519_dalek_backend="serial"'
                export AWS_LC_SYS_NO_ASM=1 AWS_LC_SYS_CMAKE_BUILDER=0
                config=(--config profile.bench.package.aws-lc-sys.opt-level=2)
                ;;
              x86_64-*/no-adx)
                export RIND_CPU_DISABLE_adx=1 RIND_CPU_DISABLE_avx512ifma=1
                export OPENSSL_ia32cap='~0x0:~0xd02b0100'
                ;;
              x86_64-*)
                # rind's AVX-512 and VAES paths also need AVX2.
                export RIND_CPU_DISABLE_adx=1 RIND_CPU_DISABLE_avx2=1 RIND_CPU_DISABLE_bmi2=1 RIND_CPU_DISABLE_sha=1
                # aws-lc's bits for those, in CPUID leaf 7's EBX (BMI1, AVX2,
                # BMI2, AVX-512 F, DQ, IFMA, CD, BW, and VL, ADX, and SHA) and
                # ECX (AVX-512 VBMI, VBMI2, VNNI, BITALG, and VPOPCNTDQ, VAES,
                # and VPCLMULQDQ).
                export OPENSSL_ia32cap='~0x0:~0x5e42f02b0128'
                # And for these rows, CPUID leaf 1's ECX: AVX, then AES-NI,
                # PCLMULQDQ, and SSE4.1, which aws-lc's one-pass
                # ChaCha20-Poly1305 needs, then SSSE3.
                case "${{ matrix.cpu }}" in
                  no-avx)
                    export RIND_CPU_DISABLE_avx=1
                    export OPENSSL_ia32cap='~0x1000000000000000:~0x5e42f02b0128'
                    ;;
                  no-aes)
                    export RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pclmulqdq=1 RIND_CPU_DISABLE_sse41=1
                    export OPENSSL_ia32cap='~0x1208000200000000:~0x5e42f02b0128'
                    ;;
                  no-ssse3)
                    export RIND_CPU_DISABLE_ssse3=1
                    export OPENSSL_ia32cap='~0x1208020200000000:~0x5e42f02b0128'
                    ;;
                esac
                ;;
            esac
          fi
          cargo bench "${config[@]}" -p rind-bench ${{ matrix.benches }} --target ${{ matrix.target }} -- --noplot "(^|/)($libs)(/|\$)"
        env:
          # Times RSA key generation too, which varies from run to run.
          NOISY_BENCHMARKS: 1
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_INCLUDE_DIR: /usr/include
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_LIB_DIR: /usr/lib/arm-linux-gnueabihf

      # Every benchmark's estimate, which the gate job checks and
      # `admin/bench-report nightly` turns into BENCHMARKS.md's CPU-tier
      # heatmap.
      - name: Save results
        shell: bash
        run: |
          # Whether the runner has the features rind's AVX-512 AES-GCM needs, so
          # the native x86_64 column names the tier it drew.
          avx512=true
          for f in avx512f avx512bw avx512vl vaes vpclmulqdq; do
            grep -m1 '^flags' /proc/cpuinfo | grep -qw "$f" || avx512=false
          done
          find target/criterion -path '*/new/benchmark.json' | sort |
            while read -r f; do
              jq -c --slurpfile e "${f%benchmark.json}estimates.json" \
                '{id: .full_id, ns: ($e[0].slope // $e[0].mean).point_estimate}' "$f"
            done |
            jq -s --arg target "$TARGET" --argjson portable "$PORTABLE" --arg tier "$TIER" \
              --arg cpu "$(lscpu | sed -n 's/^Model name: *//p' | head -n1)" --arg commit "$GITHUB_SHA" \
              --argjson avx512 "$avx512" \
              '{schema: 1, target: $target, portable: $portable, tier: $tier, cpu: $cpu, avx512: $avx512, commit: $commit, results: .}' \
              >bench-results.json
        env:
          TARGET: ${{ matrix.target }}
          PORTABLE: ${{ matrix.portable && 'true' || 'false' }}
          TIER: ${{ matrix.cpu }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.target }}${{ matrix.portable && '-portable' || '' }}${{ matrix.cpu && format('-{0}', matrix.cpu) || '' }}
          path: bench-results.json

      # One row per benchmark, in run order, with rind's time over the fastest
      # baseline's.
      - name: Summarize
        shell: bash
        run: |
          find target/criterion -path '*/new/benchmark.json' -printf '%T@ %p\n' | sort -n | cut -d' ' -f2- |
            while read -r f; do
              jq -c --slurpfile e "${f%benchmark.json}estimates.json" '.full_id | split("/")
                | {lib: map(select(. == "rind" or . == "aws-lc-rs" or . == "ring"))[0],
                   key: map(if . == "rind" or . == "aws-lc-rs" or . == "ring" then "*" else . end) | join("/"),
                   ns: ($e[0].slope // $e[0].mean).point_estimate}' "$f"
            done |
            jq -rs 'def time: if . == null then "-" elif . < 1e3 then "\(round) ns"
                      elif . < 1e6 then "\(. / 10 | round / 100) µs" else "\(. / 1e4 | round / 100) ms" end;
              reduce (.[] | select(.lib)) as $b ({}; .[$b.key][$b.lib] = $b.ns)
              | "| benchmark | rind | aws-lc-rs | ring | rind / fastest |", "|---|---|---|---|---|",
                (to_entries[] | .value as $v | ([$v["aws-lc-rs"], $v.ring] | map(select(.)) | min) as $best
                  | "| \(.key) | \($v.rind | time) | \($v["aws-lc-rs"] | time) | \($v.ring | time) | \(if $v.rind and $best then $v.rind / $best * 100 | round / 100 else "-" end) |")' |
            tee -a "$GITHUB_STEP_SUMMARY"

  # Fails the scheduled run, and so alerts, on a gap over 10% that
  # benchmarks/gaps.toml holds no decision for and that the previous
  # scheduled run showed too: GitHub draws a different CPU each night, so one
  # night's gap may be the runner's. A dispatched run is an experiment.
  gate:
    needs: native
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: .tmp/run

      - name: Download the previous scheduled run's results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml --branch main --event schedule \
            --status completed --limit 2 --json databaseId --jq "map(select(.databaseId != $GITHUB_RUN_ID))[0].databaseId")
          gh run download "$previous" --repo "$GITHUB_REPOSITORY" --pattern 'bench-*' --dir .tmp/previous

      - name: Gate
        shell: bash
        run: admin/bench-report gate .tmp/run --previous .tmp/previous | tee -a "$GITHUB_STEP_SUMMARY"
