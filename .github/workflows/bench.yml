name: bench

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # CodSpeed authenticates the upload with the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-codspeed
        run: cargo binstall -y cargo-codspeed

      - name: Build benchmarks
        run: cargo codspeed build -p rind-bench --features __bench_codspeed

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: cargo codspeed run

  # Each row reads rind's time relative to aws-lc-rs in the same run, not as
  # a device's: the arm64 runner's Neoverse core is no phone or board, and it
  # times the armv7 build natively too.
  #
  # A portable row denies both libraries what the slower path lacks: on
  # aarch64, the crypto extension and the SHA-512 and SHA-3 instructions, as
  # a Raspberry Pi 4 lacks them; on x86_64, what Sandy Bridge lacks: AVX2,
  # BMI1 and BMI2, ADX, the SHA extensions, AVX-512, VAES, and VPCLMULQDQ.
  # Two more x86_64 rows time only AES: one also denies AVX, as Westmere and
  # the Goldmont Atoms lack it, and one AES-NI and PCLMULQDQ too, as Core 2
  # and Nehalem lack them. A last row denies SSSE3 as well, as QEMU's default
  # `qemu64` model and pre-Core 2 CPUs lack it, and times the primitives that
  # then run integer or SSE2 code. rind's denial takes debug assertions,
  # which the optimised build then keeps.
  native:
    name: native (${{ matrix.target }}${{ matrix.portable && ', portable' || '' }}${{ matrix.cpu && format(', {0}', matrix.cpu) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            personality: linux64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            personality: linux64
            portable: true
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04-arm
            personality: linux32
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-adx
            benches: --bench rsa_priv
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-avx
            benches: --bench aes_gcm --bench cipher
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-aes
            benches: --bench aes_gcm --bench cipher
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            personality: linux64
            portable: true
            cpu: no-ssse3
            benches: --bench aes_gcm --bench cipher --bench chacha20poly1305 --bench sha1 --bench sha2
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Hosted hardware can change under the same label. The personality
      # makes the kernel list the features the target's code sees, such as
      # the crypto instructions aws-lc-rs uses.
      - name: Record the CPU
        shell: bash
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n1)
          features=$(setarch ${{ matrix.personality }} grep -m1 '^Features' /proc/cpuinfo | cut -d: -f2)
          echo "CPU: $model; ${{ matrix.target }} features:$features" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install OpenSSL
        if: matrix.target != 'armv7-unknown-linux-gnueabihf'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install armhf toolchain and OpenSSL
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf libssl-dev:armhf

      # Only rind and aws-lc-rs, the library it is measured against.
      - name: Run benchmarks
        run: |
          if [ "${{ matrix.portable }}" = true ]; then
            export CARGO_PROFILE_BENCH_DEBUG_ASSERTIONS=true
            case "${{ matrix.target }}/${{ matrix.cpu }}" in
              aarch64-*)
                export RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pmull=1 RIND_CPU_DISABLE_sha2=1 RIND_CPU_DISABLE_sha3=1
                # aws-lc's AES, SHA1, SHA256, PMULL, SHA512, and SHA3 bits.
                export OPENSSL_armcap='~0x87c'
                ;;
              # Haswell's path: without ADX, and for aws-lc without BMI2 and
              # ADX in CPUID leaf 7's EBX, so both run RSAZ for RSA-2048.
              x86_64-*/no-adx)
                export RIND_CPU_DISABLE_adx=1
                export OPENSSL_ia32cap='~0x0:~0x80100'
                ;;
              x86_64-*)
                # rind's AVX-512 and VAES paths also need AVX2.
                export RIND_CPU_DISABLE_adx=1 RIND_CPU_DISABLE_avx2=1 RIND_CPU_DISABLE_bmi2=1 RIND_CPU_DISABLE_sha=1
                # aws-lc's bits for those, in CPUID leaf 7's EBX (BMI1, AVX2,
                # BMI2, AVX-512 F, DQ, IFMA, CD, BW, and VL, ADX, and SHA) and
                # ECX (AVX-512 VBMI, VBMI2, VNNI, BITALG, and VPOPCNTDQ, VAES,
                # and VPCLMULQDQ).
                export OPENSSL_ia32cap='~0x0:~0x5e42f02b0128'
                # And for these rows, CPUID leaf 1's ECX: AVX, then AES-NI
                # and PCLMULQDQ, then SSSE3 and SSE4.1, which aws-lc's
                # stitched ChaCha20-Poly1305 needs and no CPU without SSSE3
                # has.
                case "${{ matrix.cpu }}" in
                  no-avx)
                    export RIND_CPU_DISABLE_avx=1
                    export OPENSSL_ia32cap='~0x1000000000000000:~0x5e42f02b0128'
                    ;;
                  no-aes)
                    export RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pclmulqdq=1
                    export OPENSSL_ia32cap='~0x1200000200000000:~0x5e42f02b0128'
                    ;;
                  no-ssse3)
                    export RIND_CPU_DISABLE_ssse3=1
                    export OPENSSL_ia32cap='~0x1208020200000000:~0x5e42f02b0128'
                    ;;
                esac
                ;;
            esac
          fi
          cargo bench -p rind-bench ${{ matrix.benches }} --target ${{ matrix.target }} -- --noplot '(^|/)(rind|aws-lc-rs)(/|$)'
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_INCLUDE_DIR: /usr/include
          ARMV7_UNKNOWN_LINUX_GNUEABIHF_OPENSSL_LIB_DIR: /usr/lib/arm-linux-gnueabihf

      # One row per benchmark, in run order, with rind's time over aws-lc-rs's.
      - name: Summarize
        shell: bash
        run: |
          find target/criterion -path '*/new/benchmark.json' -printf '%T@ %p\n' | sort -n | cut -d' ' -f2- |
            while read -r f; do
              jq -c --slurpfile e "${f%benchmark.json}estimates.json" '.full_id | split("/")
                | {lib: map(select(. == "rind" or . == "aws-lc-rs"))[0],
                   key: map(if . == "rind" or . == "aws-lc-rs" then "*" else . end) | join("/"),
                   ns: ($e[0].slope // $e[0].mean).point_estimate}' "$f"
            done |
            jq -rs 'def time: if . == null then "-" elif . < 1e3 then "\(round) ns"
                      elif . < 1e6 then "\(. / 10 | round / 100) µs" else "\(. / 1e4 | round / 100) ms" end;
              reduce (.[] | select(.lib)) as $b ({}; .[$b.key][$b.lib] = $b.ns)
              | "| benchmark | rind | aws-lc-rs | rind / aws-lc-rs |", "|---|---|---|---|",
                (to_entries[] | .value as $v
                  | "| \(.key) | \($v.rind | time) | \($v["aws-lc-rs"] | time) | \(if $v.rind and $v["aws-lc-rs"] then $v.rind / $v["aws-lc-rs"] * 100 | round / 100 else "-" end) |")' |
            tee -a "$GITHUB_STEP_SUMMARY"
