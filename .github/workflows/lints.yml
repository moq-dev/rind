name: quality lints

# Every job but the unstable rustfmt one runs the flake's pinned tools, so a
# new stable release can't fail it. `just ci` already runs x86_64 clippy and
# rustfmt on every merge.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: lints-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Check MSRV
        run: nix develop .#msrv --command cargo build --workspace --lib --bins

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The codegen calls the cross tools by their Debian names, which the dev
      # shell's PATH falls through to. The image ships the x86_64 ones.
      - name: install codegen deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cpp-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - uses: ./.github/actions/nix

      # The codegen reads s2n-bignum's assembly; nothing else does.
      - name: fetch s2n-bignum
        run: git submodule update --init --depth 1 thirdparty/s2n-bignum

      - name: check codegen
        run: |
          nix develop --command sh -c 'cd admin/parse-asm && ./all.sh'
          git diff --exit-code

      - name: check module structure
        run: nix develop --command ./admin/structure

  clippy-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- --deny warnings

  # Checks the unstable style options, which only a nightly rustfmt reads.
  rustfmt-unstable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-14
          components: rustfmt

      - name: rustfmt (nightly)
        run: cargo +nightly-2025-02-14 fmt --check -- --config-path=.rustfmt.unstable.toml
