name: x86-cpu

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: x86-cpu-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        include:
          - rustc: stable

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: actions/checkout@v4
        with:
          repository: ctz/intel-sde
          path: thirdparty/intel-sde
          persist-credentials: false

      - name: Set up Intel SDE
        run: |
          echo "PATH=$(pwd)/thirdparty/intel-sde:$PATH" >> "$GITHUB_ENV"

      - name: Install ${{ matrix.rustc }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustc }}

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build (release)
        run: cargo build --release --tests

      # Each step runs one SDE model for each distinct set of dispatch paths
      # that `rind/src/low/x86_64/cpu.rs` picks from cpuid, and asserts that
      # set with `RIND_TEST_X86_*`. Its comment names the other models that
      # select the same set.

      # Prescott, a Pentium 4, lacks SSSE3, so it runs every slowest path:
      # aws-lc's SSE2 AES and integer GHASH, ChaCha20, SHA-1, and SHA-256, the
      # portable ML-KEM arithmetic, s2n-bignum's `_alt` routines, and aws-lc's
      # Montgomery multiplication.
      - name: Check Prescott
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -p4p --"
          RIND_TEST_X86_SSSE3: 0
          RIND_TEST_X86_SSE41: 0
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Merom, the first Core 2, adds SSSE3 but not SSE4.1 or AES-NI, so it
      # runs aws-lc's vpaes and SSSE3 GHASH, ChaCha20, SHA-1, and SHA-256,
      # beside Prescott's other paths. Saltwell selects the same paths.
      - name: Check Merom
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -mrm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 0
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Nehalem adds SSE4.1, so ChaCha20-Poly1305 runs in one pass, but still
      # lacks AES-NI, so it otherwise runs Merom's paths. Penryn selects the
      # same paths.
      - name: Check Nehalem
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -nhm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Westmere adds AES-NI and PCLMULQDQ without AVX, so rind's AES-GCM and
      # GHASH intrinsics run without VEX encoding. Silvermont selects the same
      # paths.
      - name: Check Westmere
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -wsm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Goldmont, an Atom, runs Westmere's paths, but SHA-1 and SHA-256 on
      # its SHA extensions. Goldmont Plus, Tremont, and Snow Ridge select the
      # same paths.
      - name: Check Goldmont
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -glm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Sandy Bridge lacks AVX2, BMI2, and ADX, so aws-lc's AVX SHA and SSSE3
      # ChaCha20 routines, the portable ML-KEM arithmetic, s2n-bignum's
      # `_alt` routines, and aws-lc's Montgomery multiplication run. Ivy
      # Bridge selects the same paths.
      - name: Check Sandy Bridge
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -snb --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Haswell lacks ADX, so s2n-bignum's `_alt` routines, aws-lc's
      # Montgomery multiplication, and its RSAZ exponentiation for RSA-2048
      # run, beside the AVX2 kernels.
      - name: Check Haswell
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -hsw --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Skylake server has AVX-512 but neither SHA nor VAES, so it runs the
      # AVX2 kernels with s2n-bignum's BMI2 and ADX routines, and aws-lc's AVX
      # SHA. Broadwell, Skylake, Cascade Lake, and Cooper Lake select the
      # same paths.
      - name: Check Skylake server
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -skx --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Cannon Lake adds SHA, but lacks VAES and AVX-512 VBMI2, so it runs
      # Skylake server's paths with SHA-1 and SHA-256 on the SHA extensions.
      - name: Check Cannon Lake
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -cnl --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Alder Lake adds VAES without AVX-512, so AES-GCM runs on 256-bit
      # vectors. Meteor, Raptor, Arrow, Lunar, and Panther Lake, and Sierra
      # and Clearwater Forest, select the same paths.
      - name: Check Alder Lake
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -adl --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Granite Rapids limited to 256-bit AVX10 hides AVX-512F, so it selects
      # Alder Lake's paths, checking that rind takes no AVX-512 path there.
      - name: Check Granite Rapids (AVX10.1 / 256VL)
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -gnr256 --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0

      # Diamond Rapids selects every path, including AVX-512 AES-GCM and
      # ML-KEM. Ice Lake, Ice Lake server, Tiger Lake, and Sapphire, Emerald,
      # and Granite Rapids select the same paths.
      - name: Check Diamond Rapids
        run: cargo test --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -dmr --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 1
          RIND_TEST_X86_AVX512_ML_KEM: 1
