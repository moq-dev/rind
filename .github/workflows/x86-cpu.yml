name: x86-cpu

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - rind/src/**
      - rind/Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - .github/workflows/x86-cpu.yml

permissions:
  contents: read

concurrency:
  group: x86-cpu-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `wipe` adds the zeroing tests to each model's run; it only changes
      # what a drop writes, which the native runners test without it.
      # rind-fips is left out: its module refuses CPUs below its baseline,
      # as most of these models are.
      - name: Build (release)
        run: nix develop .#sde --command cargo build --release --tests --workspace --exclude rind-fips --features rind/wipe

      # Each step runs one SDE model for each distinct set of dispatch paths
      # that `rind/src/low/x86_64/cpu.rs` picks from cpuid, and asserts that
      # set with `RIND_TEST_X86_*`. Its comment names the other models that
      # select the same set, per the scans `admin/x86-cpu sde-scan` saves in
      # `admin/x86-cpus`.

      # Prescott, a Pentium 4, lacks SSSE3, so it runs every slowest path:
      # aws-lc's SSE2 AES and integer GHASH, SHA-1, and SHA-256, HACL*'s
      # ChaCha20 rounds, the portable ML-KEM arithmetic, s2n-bignum's `_alt` routines, and aws-lc's
      # Montgomery multiplication.
      - name: Check Prescott
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -p4p --"
          RIND_TEST_X86_SSSE3: 0
          RIND_TEST_X86_SSE41: 0
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Merom, the first Core 2, adds SSSE3 but not SSE4.1 or AES-NI, so it
      # runs aws-lc's vpaes and SSSE3 GHASH, ChaCha20, SHA-1, and SHA-256,
      # beside Prescott's other paths. Saltwell selects the same paths.
      - name: Check Merom
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -mrm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 0
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Nehalem adds SSE4.1, so ChaCha20-Poly1305 runs in one pass, but still
      # lacks AES-NI, so it otherwise runs Merom's paths. Penryn selects the
      # same paths.
      - name: Check Nehalem
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -nhm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 0
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Westmere adds AES-NI and PCLMULQDQ without AVX, so rind's AES-GCM and
      # GHASH intrinsics run without VEX encoding. Silvermont selects the same
      # paths.
      - name: Check Westmere
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -wsm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Goldmont, an Atom, runs Westmere's paths, but SHA-1 and SHA-256 on
      # its SHA extensions. Goldmont Plus, Tremont, and Snow Ridge select the
      # same paths.
      - name: Check Goldmont
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -glm --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 0
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Sandy Bridge lacks AVX2, MOVBE, BMI2, and ADX, so rind's AES-GCM
      # intrinsics, aws-lc's AVX SHA and SSSE3 ChaCha20 routines, the portable
      # ML-KEM arithmetic, s2n-bignum's `_alt` routines, and aws-lc's
      # Montgomery multiplication run. Ivy Bridge selects the same paths.
      - name: Check Sandy Bridge
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -snb --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 0
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 0
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Haswell lacks ADX and VAES, so s2n-bignum's `_alt` routines, aws-lc's
      # Montgomery multiplication, its RSAZ exponentiation for RSA-2048, and
      # its AVX AES-GCM run, beside the AVX2 kernels.
      - name: Check Haswell
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -hsw --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 0
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Skylake server has AVX-512 but neither SHA nor VAES, so it runs the
      # AVX2 kernels with s2n-bignum's BMI2 and ADX routines, aws-lc's AVX
      # AES-GCM, and OpenSSL's AVX2 SHA-256 and SHA-512. Broadwell, Skylake,
      # Cascade Lake, and Cooper Lake select the same paths.
      - name: Check Skylake server
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -skx --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 0
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Cannon Lake adds SHA and AVX-512 IFMA, but lacks VAES and AVX-512
      # VBMI2, so it runs Skylake server's paths with SHA-1 and SHA-256 on the
      # SHA extensions, and RSA on aws-lc's dual AVX-512 RSAZ.
      - name: Check Cannon Lake
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -cnl --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 0
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 1

      # Alder Lake adds VAES without AVX-512, so AES-GCM runs on 256-bit
      # vectors. Meteor and Raptor Lake, and Sierra Forest, select the same
      # paths.
      - name: Check Alder Lake
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -adl --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Arrow Lake adds the SHA512 instructions to Alder Lake's paths, so
      # SHA-384 and SHA-512 run OpenSSL's routine for them. Lunar and Panther
      # Lake, and Clearwater Forest, select the same paths.
      - name: Check Arrow Lake
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -arl --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 1
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Granite Rapids limited to 256-bit AVX10 hides AVX-512F, so it selects
      # Alder Lake's paths, checking that rind takes no AVX-512 path there.
      - name: Check Granite Rapids (AVX10.1 / 256VL)
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -gnr256 --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 0
          RIND_TEST_X86_AVX512_ML_KEM: 0
          RIND_TEST_X86_AVX512_RSA: 0

      # Granite Rapids selects every path but the SHA512 instructions',
      # including AVX-512 AES-GCM, ML-KEM, and RSA. Ice Lake, Ice Lake server,
      # Tiger Lake, and Sapphire and Emerald Rapids select the same paths.
      - name: Check Granite Rapids
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -gnr --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 0
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 1
          RIND_TEST_X86_AVX512_ML_KEM: 1
          RIND_TEST_X86_AVX512_RSA: 1

      # Diamond Rapids selects every path, Granite Rapids' and the SHA512
      # instructions'.
      - name: Check Diamond Rapids
        run: nix develop .#sde --command cargo test --release --workspace --exclude rind-fips --features rind/wipe
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sde -dmr --"
          RIND_TEST_X86_SSSE3: 1
          RIND_TEST_X86_SSE41: 1
          RIND_TEST_X86_AES_HARDWARE: 1
          RIND_TEST_X86_AVX: 1
          RIND_TEST_X86_AVX2: 1
          RIND_TEST_X86_BMI2_ADX: 1
          RIND_TEST_X86_SHA: 1
          RIND_TEST_X86_SHA512: 1
          RIND_TEST_X86_VAES_AES_GCM: 1
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: 1
          RIND_TEST_X86_AVX512_AES_GCM: 1
          RIND_TEST_X86_AVX512_ML_KEM: 1
          RIND_TEST_X86_AVX512_RSA: 1
