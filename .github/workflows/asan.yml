name: asan

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: asan-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Some of the crate dependencies compile C code. Using
  # "-Zexternal-clangrt" keeps the Rust and C object files
  # from ending up with dependencies on conflicting versions
  # of the ASAN runtime.
  RUSTFLAGS: "-Zsanitizer=address -Zexternal-clangrt -lasan"
  ASAN_OPTIONS: halt_on_error=0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: ASAN tests (release)
        # Specify the target so the -Zsanitizer setting doesn't break
        # proc macro compilation in any of the crate dependencies.
        run: cargo test --release --target="$(rustc --print host-tuple)"
