name: Check

permissions:
  contents: read

# Main checks every crate; Queue checks each picked PR against its base.
on:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      # A query failure fails this job.
      - name: Select work
        id: scope
        run: just ci-select --all >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix
        if: steps.scope.outputs.needed == 'true'

      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Each fixture is its own workspace with its own target (sh/dispatch.sh's
          # check:fixtures, sh/patch.sh), which the default `.` alone leaves cold.
          workspaces: |
            .
            admin/build-cost-fixtures/rind
            admin/build-cost-fixtures/rustls
            patch/fixture

      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci --all
