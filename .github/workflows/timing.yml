name: timing

# Times rind's secret operations on GitHub's x86_64 and arm64 runners with
# `admin/timing`: dudect's two-class test of every operation, on each CPU tier
# ctgrind checks, and the Marvin toolkit's RSA-OAEP probes. Weekly, since a
# run takes hours of runner time, and a leak shows on any run.

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each row but the first denies what the CPU it names lacks, as ctgrind's
  # rows do, so the code those CPUs run is timed too. A denial takes
  # `--cfg rind_cpu_disable`, so the release build stays the code that ships.
  dudect:
    name: dudect (${{ matrix.os }}, ${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cpu: native
          - os: ubuntu-latest
            cpu: haswell
            deny: adx avx512f avx512dq avx512ifma avx512bw avx512vl avx512vbmi avx512vbmi2 vaes vpclmulqdq sha sha512
          - os: ubuntu-latest
            cpu: westmere
            deny: adx avx512f avx512dq avx512ifma avx512bw avx512vl avx512vbmi avx512vbmi2 vaes vpclmulqdq sha sha512 avx avx2 bmi1 bmi2 movbe intel
          - os: ubuntu-latest
            cpu: core2
            deny: adx avx512f avx512dq avx512ifma avx512bw avx512vl avx512vbmi avx512vbmi2 vaes vpclmulqdq sha sha512 avx avx2 bmi1 bmi2 movbe intel aes pclmulqdq sse41
          - os: ubuntu-latest
            cpu: qemu64
            deny: adx avx512f avx512dq avx512ifma avx512bw avx512vl avx512vbmi avx512vbmi2 vaes vpclmulqdq sha sha512 avx avx2 bmi1 bmi2 movbe intel aes pclmulqdq sse41 ssse3
          - os: ubuntu-24.04-arm
            cpu: native
          - os: ubuntu-24.04-arm
            cpu: no-crypto
            deny: aes pmull sha2 sha3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: dudect
        run: |
          deny=()
          for feature in $DENY; do
            deny+=("RIND_CPU_DISABLE_$feature=1")
          done
          nix develop .#timing --command env "${deny[@]}" admin/timing dudect
        env:
          DENY: ${{ matrix.deny }}
          RUSTFLAGS: ${{ matrix.deny && '--cfg rind_cpu_disable' || '' }}

  marvin:
    name: marvin (${{ matrix.os }}, RSA-${{ matrix.bits }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bits: [2048, 3072, 4096]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: marvin
        run: nix develop .#timing --command admin/timing marvin ${{ matrix.bits }}

      - name: Upload the analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marvin-${{ matrix.os }}-rsa${{ matrix.bits }}
          path: |
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/report.*
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/*.png
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/analysis_results
          if-no-files-found: ignore
